name: CI · tests, security, Android APK

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Least privilege (audit 2026-11, AUD-21): read-only by default; only the Android job, which publishes the release,
# gets contents: write. Third-party actions are pinned to commit SHAs.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + API tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
      - name: Secret scan (no keys committed)
        run: |
          if git grep -nE '(rzp_(live|test)_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,})' -- ':!*.test.js' ':!docs/*'; then
            echo "Possible secret committed"; exit 1; fi

  e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start API server
        run: |
          PORT=8080 LOG_REQUESTS=0 node --no-warnings server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
      - name: E2E v0.3–v0.7 (desktop + mobile; third-party map services served from fixtures, OSM Notes API mocked)
        run: CHROME=$(which google-chrome || which chromium) node tests/e2e.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots, retention-days: 14 }

  android:
    name: Build Android APK (signed release + debug)
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write   # publish the APK as a GitHub Release
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_B64 != '' }}
      VER: 0.7.${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Assemble web bundle (www/)
        env:
          MAPOS_API_BASE: ${{ vars.MAPOS_API_BASE }}   # set in repo Settings → Variables once the backend is deployed
        run: node scripts/build-www.mjs
      - run: npx cap sync android
      - name: Decode release keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KSP: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KA: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$KS" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/bharatmap-release.jks"
          echo "decoded keystore sha256: $(sha256sum "$RUNNER_TEMP/bharatmap-release.jks" | cut -c1-64) ($(stat -c%s "$RUNNER_TEMP/bharatmap-release.jks") bytes)"
          keytool -list -keystore "$RUNNER_TEMP/bharatmap-release.jks" -storepass "$KSP" -alias "$KA" > /dev/null \
            && echo "keystore opens with ANDROID_KEYSTORE_PASSWORD and contains alias ANDROID_KEY_ALIAS" \
            || { echo "::error::keystore could not be opened with the stored password/alias (secret pasted incorrectly?)"; exit 1; }
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/bharatmap-release.jks" >> "$GITHUB_ENV"
      - name: Warn when release signing secrets are missing
        if: env.HAS_KEYSTORE != 'true'
        run: echo "::warning::ANDROID_KEYSTORE_B64 secret not set - release APK will be unsigned and only the debug APK is published."
      - name: Gradle build (assembleDebug + assembleRelease)
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.7.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug assembleRelease
          ./gradlew --no-daemon lintDebug || echo "lint reported issues (non-blocking)"
      - name: Remove decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/bharatmap-release.jks"
      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/bharat-map-$VER-debug.apk
          if [ -f android/app/build/outputs/apk/release/app-release.apk ]; then
            cp android/app/build/outputs/apk/release/app-release.apk out/bharat-map-$VER.apk
          elif [ "$HAS_KEYSTORE" = "true" ]; then
            echo "::error::Keystore was provided but no signed app-release.apk was produced"; ls -la android/app/build/outputs/apk/release; exit 1
          else
            # No signing secrets: keep the unsigned release build as a CI artifact so it can be signed offline with the release key.
            mkdir -p out-unsigned
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk out-unsigned/bharat-map-$VER-release-unsigned.apk
            ls -la out-unsigned
          fi
          ls -la out
      - name: Verify release signature and manifest (apksigner, aapt)
        if: hashFiles('out/bharat-map-*[0-9].apk') != ''
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=out/bharat-map-$VER.apk
          echo "build-tools: $BT"
          $BT/zipalign -c -P 16 -v 4 "$APK" > /dev/null && echo "zipalign: OK (4-byte, 16K .so pages)" || $BT/zipalign -c -v 4 "$APK" | tail -1
          $BT/apksigner verify --verbose --print-certs "$APK" | tee apksigner.txt
          # Pin the release certificate itself (a CN string can be forged by any self-signed key).
          grep -qi "certificate SHA-256 digest: d04d20f9fd727d7ca6d966e771e2ed5760b20fefe9c139d36f0e3e86b7997c6c" apksigner.txt || { echo "::error::release APK is not signed with the Bharat Map release key (d04d20f9…)"; exit 1; }
          echo "--- debuggable check ---"
          $BT/aapt dump badging "$APK" | grep -E "^package:|application-debuggable" || true
          if $BT/aapt dump badging "$APK" | grep -q application-debuggable; then echo "::error::release APK is debuggable"; exit 1; fi
          echo "debuggable=false (no application-debuggable in aapt badging)"
          $BT/aapt2 dump xmltree --file AndroidManifest.xml "$APK" | grep -i debuggable || echo "AndroidManifest.xml: no android:debuggable attribute"
          echo "--- debug APK cert (for comparison) ---"
          $BT/apksigner verify --print-certs out/bharat-map-$VER-debug.apk | grep -E "DN|SHA-256"
          {
            echo "## Release signature"; echo '```'; cat apksigner.txt | grep -E "Verifies|v1|v2|v3|DN|SHA-256"; echo "debuggable=false"; echo '```'
          } >> $GITHUB_STEP_SUMMARY
      - name: Check unsigned release build (not debuggable)
        if: hashFiles('out-unsigned/*.apk') != ''
        run: |
          BT=$ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | sort -V | tail -1)
          APK=$(ls out-unsigned/*.apk)
          $BT/aapt dump badging "$APK" | grep -E "^package:|application-debuggable" || true
          if $BT/aapt dump badging "$APK" | grep -q application-debuggable; then echo "::error::release APK is debuggable"; exit 1; fi
          echo "debuggable=false (no application-debuggable in aapt badging)"
          $BT/zipalign -c -P 16 -v 4 "$APK" > /dev/null && echo "zipalign: OK (4-byte, 16K .so pages)" || echo "zipalign check: not aligned"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: hashFiles('out-unsigned/*.apk') != ''
        with: { name: bharat-map-release-unsigned, path: out-unsigned/*.apk, retention-days: 7 }
      - name: APK size report (informational, never fails the build)
        run: |
          echo "## APK size" >> $GITHUB_STEP_SUMMARY
          for APK in out/*.apk; do echo "$(basename $APK): $(du -h $APK | cut -f1) ($(stat -c%s $APK) bytes)" | tee -a $GITHUB_STEP_SUMMARY; done
          APK=$(ls out/*.apk | head -1)
          echo '```' >> $GITHUB_STEP_SUMMARY
          unzip -lv "$APK" | awk 'NR>3 && $1 ~ /^[0-9]+$/ { split($8, p, "/"); key = p[1]; if (key == "assets") key = p[1] "/" p[2] "/" p[3]; raw[key] += $1; comp[key] += $3 } END { for (k in raw) printf "%10.1f MB stored %10.1f MB raw  %s\n", comp[k]/1048576, raw[k]/1048576, k }' | sort -rn | head -20 | tee -a $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: bharat-map-apk, path: out/*.apk, retention-days: 30 }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with: { name: android-lint, path: android/app/build/reports/lint-results-debug.html, retention-days: 14 }
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          FEATURES="Bharat Map 0.7 (build ${{ github.run_number }}): NEW in 0.7.20+ (competitor gaps, docs/UPGRADE_REPORT_2026-11.md): Prefer main roads routing (Valhalla costing; labelled when not applied), locality-aware and typo-tolerant search (name, locality), metro get-off and arrival alarms (foreground), community incidents announced along the route with a Still there? check, no silent reroutes (faster routes are offered with the minutes saved; auto-switch is opt-in), exact pickup hand-off (pin + DIGIPIN + landmark), Add a missing place (structured OSM note), Bengaluru Namma Metro schedules (unofficial ODbL GTFS, approximated times). Also: place-card service panels for 12 place types with every value labelled Live / Scheduled / Estimate / Link-out / Demo / Unavailable (no fabricated prices, fares, showtimes or ETAs); a catalogue of 93 providers, each honestly classified; verified app deep links from the providers' own APK manifests (Uber documented pickup/drop; App Links that open Swiggy, Zomato, District, BookMyShow, Blinkit, Agoda, MakeMyTrip, Park+, Apollo 24|7 and Tata 1mg when installed, else their website; Rapido opens its app home, labelled Unverified; no payment-app links), with new link-outs for Bharat Taxi, Yatri Sathi, Swiggy Dineout, ParkMate, Highway Delite, ChargeZone, KSRTC (Karnataka, Kerala), TNSTC, Noida/Ahmedabad/Lucknow/Kanpur/Kolkata metros, DMart Ready and JioMart through a link-out screen that names the destination; Hyderabad Metro scheduled departures from HMRL GTFS; Uber universal link with pickup/drop; online orders now wait as pending payment on a separate payment screen (Razorpay, plus Cashfree / PhonePe / Paytm prototype adapters, enabled only by server keys; without keys it says Payments not configured and nothing is charged; no upi:// intents); live traffic only with a TomTom/HERE key (otherwise Live traffic unavailable); truck routing via Valhalla truck costing; ONDC buyer prototype behind a flag (demo catalogue, not the ONDC network); admin Listings for place verification and provider links. Earlier: device tiers, offline search v2, India road hints, Indic voices, lane guidance, speed limits, offline maps for 11 cities, voice search, live location sharing."
          if [ -f "out/bharat-map-$VER.apk" ]; then
            ASSETS="out/bharat-map-$VER.apk out/bharat-map-$VER-debug.apk"
            INSTALL="Install bharat-map-$VER.apk - the signed RELEASE build (not debuggable, no R8/minification). IMPORTANT: it is signed with the Bharat Map release key, which differs from the debug key used by earlier builds (0.5.12 and older; 0.5.13 and later use the release key), so Android will refuse to update over a debug install - uninstall the old debug build once, then install this APK (Install unknown apps must be allowed). Future release builds will update in place. bharat-map-$VER-debug.apk is the debug build, for troubleshooting only."
          else
            ASSETS="out/bharat-map-$VER-debug.apk"
            INSTALL="Release signing secrets (ANDROID_KEYSTORE_B64 etc.) were not available to this run; the release-key-signed APK, if any, is attached separately after offline signing."
          fi
          printf '%s\n\n%s\n\nAutomated build of %s. See docs/TEST-REPORT.md.\n' "$INSTALL" "$FEATURES" "${{ github.sha }}" > notes.md
          gh release create "v$VER" $ASSETS --title "Bharat Map $VER" --notes-file notes.md
