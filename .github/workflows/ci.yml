name: CI · tests, security, Android APK

on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # publish the APK as a GitHub Release

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Unit + API tests, audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm test
      - name: Dependency audit (fails on high/critical)
        run: npm audit --audit-level=high
      - name: Secret scan (no keys committed)
        run: |
          if git grep -nE '(rzp_(live|test)_[A-Za-z0-9]{10,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA|EC|OPENSSH) PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,})' -- ':!*.test.js' ':!docs/*'; then
            echo "Possible secret committed"; exit 1; fi

  e2e:
    name: Browser E2E (Chromium)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Start API server
        run: |
          PORT=8080 LOG_REQUESTS=0 node --no-warnings server/index.js > server.log 2>&1 &
          for i in $(seq 1 30); do curl -sf localhost:8080/api/health && break; sleep 1; done
      - name: E2E (desktop + mobile, offline map, admin)
        run: CHROME=$(which google-chrome || which chromium) node tests/e2e.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: e2e-screenshots, path: docs/screenshots, retention-days: 14 }

  android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: test
    env:
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Assemble web bundle (www/)
        env:
          MAPOS_API_BASE: ${{ vars.MAPOS_API_BASE }}   # set in repo Settings → Variables once the backend is deployed
        run: node scripts/build-www.mjs
      - run: npx cap sync android
      - name: Decode release keystore (optional)
        if: env.HAS_KEYSTORE == 'true'
        env: { KS: "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" }
        run: echo "$KS" | base64 -d > android/app/release.keystore
      - name: Gradle build
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
          VERSION_NAME: 0.2.${{ github.run_number }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          ./gradlew --no-daemon lintDebug || echo "lint reported issues (non-blocking)"
          if [ -f app/release.keystore ]; then ./gradlew --no-daemon assembleRelease; fi
      - name: Collect APKs
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/app-debug.apk out/bharat-map-0.2.${{ github.run_number }}-debug.apk
          [ -f android/app/build/outputs/apk/release/app-release.apk ] && cp android/app/build/outputs/apk/release/app-release.apk out/bharat-map-0.2.${{ github.run_number }}-release.apk || true
          ls -la out
      - uses: actions/upload-artifact@v4
        with: { name: bharat-map-apk, path: out/*.apk, retention-days: 30 }
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: android-lint, path: android/app/build/reports/lint-results-debug.html, retention-days: 14 }
      - name: Publish GitHub Release
        if: github.ref == 'refs/heads/main'
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          gh release create "v0.2.${{ github.run_number }}" out/*.apk \
            --title "Bharat Map 0.2.${{ github.run_number }} (Android)" \
            --notes "Automated build of ${{ github.sha }}. Debug-signed APK: enable 'Install unknown apps' to sideload. See docs/TEST-REPORT.md."
