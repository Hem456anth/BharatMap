# Render Blueprint: one-click backend deploy (Dashboard → New → Blueprint → pick this repo).
# Free plan: no persistent disk, so SQLite resets on each deploy/restart (fictional demo data reseeds).
# For persistence switch to a paid instance and uncomment the disk.
services:
  - type: web
    name: india-mapos-api
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_PASSWORD
        sync: false          # set in the dashboard (min 12 chars)
      - key: ADMIN_EMAIL
        value: admin@mapos.demo
      - key: CORS_ORIGINS
        value: https://localhost,capacitor://localhost
      - key: RAZORPAY_KEY_ID
        sync: false          # rzp_test_… for Test Mode
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # v0.4 map services (/api/v1). Unset = public OSM instances, throttled to 1 req/s (dev only).
      - key: VALHALLA_URL
        sync: false          # e.g. https://valhalla.example.in (self-hosted, docs/SELF_HOSTING.md)
      - key: PHOTON_URL
        sync: false
      - key: NOMINATIM_URL
        sync: false
      - key: OSRM_URL_CAR
        sync: false
      - key: OVERPASS_URL
        sync: false
      - key: OCM_API_KEY
        sync: false          # Open Charge Map key (kept server-side; never shipped in the app)
      - key: HTTP_USER_AGENT
        value: BharatMap/0.4 (+https://github.com/Hem456anth/BharatMap)
      - key: CLIENT_SERVICES
        value: server
      - key: V1_RATE_BURST
        value: "60"
      - key: V1_RATE_PER_SEC
        value: "2"
    # disk:
    #   name: mapos-data
    #   mountPath: /data
    #   sizeGB: 1
