apply plugin: 'com.android.application'

android {
    namespace "com.indiamapos.app"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.indiamapos.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode Integer.parseInt(System.getenv("VERSION_CODE") ?: "3")
        versionName(System.getenv("VERSION_NAME") ?: "0.3.0")
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    // Release signing: CI decodes the ANDROID_KEYSTORE_B64 secret to a file and passes its path in
    // ANDROID_KEYSTORE_PATH (falls back to app/release.keystore). If the keystore or any password is
    // missing, the release build still assembles but stays UNSIGNED (app-release-unsigned.apk) instead of failing.
    def releaseKeystorePath = System.getenv('ANDROID_KEYSTORE_PATH') ?: 'release.keystore'
    def releaseKeystore = file(releaseKeystorePath)
    def releaseStorePass = System.getenv('ANDROID_KEYSTORE_PASSWORD')
    def releaseKeyAlias = System.getenv('ANDROID_KEY_ALIAS')
    def releaseKeyPass = System.getenv('ANDROID_KEY_PASSWORD')
    def hasReleaseSigning = releaseKeystore.exists() && releaseStorePass && releaseKeyAlias && releaseKeyPass
    if (!hasReleaseSigning) {
        logger.warn("Bharat Map: release keystore/passwords not provided - release APK will be unsigned.")
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile releaseKeystore
                storePassword releaseStorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
                enableV1Signing true
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    lint {
        abortOnError false
        checkReleaseBuilds false
    }
    buildTypes {
        release {
            if (hasReleaseSigning) { signingConfig signingConfigs.release }
            debuggable false
            // Deliberately no R8/minification and no resource shrinking (project decision).
            minifyEnabled false
            shrinkResources false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
